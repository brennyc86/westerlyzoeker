name: Zoek Westerly's
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths: ["westerly.py", "config.json"]
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  zoek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 westerly.py
      - name: Opslaan
        run: |
          git config user.name "zoek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Data bijgewerkt" && git pull --rebase -X theirs && git push)
